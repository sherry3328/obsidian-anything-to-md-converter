name: Reusable Obsidian Plugin Release

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Tag name for this release (must start with v)"
        required: true
        type: string
      release_files:
        description: "Newline separated list of release asset files"
        required: false
        type: string
        default: |
          main.js
          manifest.json
          styles.css
      working_directory:
        description: "Plugin project directory (relative path from repo root)"
        required: false
        type: string
        default: "."
      node_version:
        description: "Node.js version used for build"
        required: false
        type: string
        default: "20"
      install_command:
        description: "Install command"
        required: false
        type: string
        default: "npm ci"
      build_command:
        description: "Build command that produces release assets"
        required: false
        type: string
        default: "npm run build"
      verify_versions:
        description: "Verify manifest/package versions and tag alignment"
        required: false
        type: boolean
        default: true
      manifest_path:
        description: "Path to manifest.json (relative to working_directory)"
        required: false
        type: string
        default: "manifest.json"
      package_json_path:
        description: "Path to package.json (relative to working_directory)"
        required: false
        type: string
        default: "package.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag format
        run: |
          if [[ ! "${{ inputs.release_tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$ ]]; then
            echo "release_tag must look like vX.Y.Z (allowing suffix, e.g. v1.2.3-beta.1)." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.install_command }}

      - name: Build plugin
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.build_command }}

      - name: Verify versions and tag alignment
        if: ${{ inputs.verify_versions }}
        working-directory: ${{ inputs.working_directory }}
        run: |
          manifest_version="$(jq -r '.version' "${{ inputs.manifest_path }}")"
          package_version="$(jq -r '.version' "${{ inputs.package_json_path }}")"
          tag_version="${{ inputs.release_tag }}"
          tag_version="${tag_version#v}"

          if [[ "$manifest_version" != "$package_version" ]]; then
            echo "Version mismatch: manifest.json=$manifest_version, package.json=$package_version" >&2
            exit 1
          fi

          if [[ "$manifest_version" != "$tag_version" ]]; then
            echo "Tag/version mismatch: tag=${{ inputs.release_tag }}, manifest=$manifest_version" >&2
            exit 1
          fi

      - name: Prepare release file list
        id: release-files
        run: |
          workdir="${{ inputs.working_directory }}"
          if [[ "$workdir" == "." ]]; then
            prefix=""
          else
            prefix="${workdir%/}/"
          fi

          : > release-files.txt
          while IFS= read -r path || [[ -n "$path" ]]; do
            [[ -z "$path" ]] && continue
            clean="${path#./}"
            full="${prefix}${clean}"
            if [[ ! -f "$full" ]]; then
              echo "Missing release asset: $full" >&2
              exit 1
            fi
            echo "$full" >> release-files.txt
          done <<< "${{ inputs.release_files }}"

          {
            echo "files<<EOF"
            cat release-files.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.release-files.outputs.files }}
          fail_on_unmatched_files: true
